<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Everyday</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E3EEEA">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#3D5257;
  --ink-soft:#7C9296;
  --parchment:#E3EEEA;
  --parchment-2:#D6E6E1;
  --card:#F3F8F6;
  --moss:#3A6B63;
  --moss-dark:#2A4F49;
  --moss-tint:#D7E9E5;
  --gold:#C08A3E;
  --gold-tint:#F3E3C4;
  --rule:#C9DCD7;
  --white:#FBFEFD;
  --danger:#A6452F;
  --shadow: 0 1px 2px rgba(61,82,87,0.06), 0 4px 10px rgba(61,82,87,0.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background: radial-gradient(1200px 600px at 10% -10%, #F3EFE2 0%, transparent 60%), var(--parchment);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.app{ width:100%; max-width:540px; min-height:100vh; display:flex; flex-direction:column; }

.masthead{
  padding:22px 18px 12px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg, var(--parchment-2), var(--parchment));
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em;
  color:var(--moss-dark); text-transform:uppercase; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; }
.masthead h1{ font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:6px 0 2px; letter-spacing:-0.01em; }
.masthead .sub{ font-size:12.5px; color:var(--ink-soft); }
.masthead-top{ display:flex; align-items:center; justify-content:space-between; }
.home-btn{
  background:var(--moss); color:var(--white); border:none; border-radius:20px;
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em;
  padding:8px 14px; cursor:pointer; display:flex; align-items:center; gap:6px; flex-shrink:0;
}
.home-btn svg{ width:13px; height:13px; }
.home-btn svg path{ stroke:var(--white); }
.sync-btn{
  background:transparent; color:var(--moss-dark); border:1px solid var(--moss); border-radius:20px;
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.03em;
  padding:7px 12px; cursor:pointer; flex-shrink:0;
}
.sync-btn.connected{ background:var(--moss); color:var(--white); }
.header-btns{ display:flex; gap:8px; align-items:center; }

/* Top tabs */
.tabstrip{
  display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 14px;
  background:var(--parchment); border-bottom:1px solid var(--rule);
}
.tab-btn{
  flex:0 0 auto; background:var(--card); border:1px solid var(--rule); color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.03em;
  padding:8px 12px; border-radius:20px; cursor:pointer; white-space:nowrap;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.tab-btn.active{ background:var(--moss); color:var(--white); border-color:var(--moss); }

main{ flex:1; padding:18px 16px 60px; overflow-y:auto; }

.section-title{
  font-family:'Fraunces', serif; font-size:15px; font-weight:600; color:var(--ink);
  margin:20px 4px 10px; display:flex; align-items:baseline; justify-content:space-between;
}
.section-title:first-child{ margin-top:0; }
.section-title span.count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); font-weight:400; }

/* Cards */
.card{ background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); }
.row{ display:flex; align-items:center; gap:12px; }
.row-title{ flex:1; }
.row-title .name{ font-family:'Fraunces', serif; font-size:15.5px; font-weight:500; color:var(--ink); }
.row-title .meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
.open-link{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--moss-dark); background:none; border:none; cursor:pointer; padding:4px 0; text-decoration:underline; }

.toggle{
  width:38px; height:38px; border-radius:50%; border:1.5px solid var(--moss); background:var(--white);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  transition:background .15s ease, transform .1s ease;
}
.toggle:active{ transform:scale(0.92); }
.toggle svg{ opacity:0; transition:opacity .15s ease; }
.toggle.done{ background:var(--moss); border-color:var(--moss); }
.toggle.done svg{ opacity:1; }
.toggle svg path{ stroke:var(--white); }

/* Weekly view */
.week-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.week-head .label{ font-family:'Fraunces', serif; font-size:15px; font-weight:600; }
.week-nav{ display:flex; gap:6px; }
.week-nav button{ border:1px solid var(--rule); background:var(--white); border-radius:8px; width:28px; height:28px; cursor:pointer; color:var(--moss-dark); font-family:'IBM Plex Mono', monospace; }
.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.week-cell{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px 10px;
  border-radius:12px; border:1px solid var(--rule); background:var(--white); cursor:pointer;
}
.week-cell.today{ border-color:var(--gold); border-width:2px; }
.week-cell.selected{ background:var(--moss-tint); border-color:var(--moss); }
.week-cell .dow{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-soft); text-transform:uppercase; }
.week-cell .dnum{ font-family:'Fraunces', serif; font-size:15px; font-weight:600; color:var(--ink); }
.week-dots{ display:grid; grid-template-columns:repeat(2,1fr); gap:3px; margin-top:2px; }
.week-dot{ width:6px; height:6px; border-radius:50%; border:1px solid var(--moss); background:transparent; }
.week-dot.on{ background:var(--moss); }

.day-detail{ background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:14px; margin-top:12px; }
.day-detail .dd-title{ font-family:'Fraunces', serif; font-size:15px; font-weight:600; margin-bottom:8px; }
.dd-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--rule); font-size:13.5px; }
.dd-row:last-child{ border-bottom:none; }
.dd-status{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; }
.dd-status.done{ color:var(--moss-dark); }
.dd-status.pending{ color:var(--ink-soft); }

/* Meditation */
.timer-options{ display:flex; gap:8px; margin-bottom:12px; }
.timer-options button{
  flex:1; background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:12px 6px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink); cursor:pointer;
}
.timer-options button.active{ background:var(--moss); color:var(--white); border-color:var(--moss); }
.timer-display{
  text-align:center; padding:22px 10px; background:var(--card); border:1px solid var(--rule); border-radius:16px; margin-bottom:12px;
}
.timer-display .time{ font-family:'Fraunces', serif; font-size:46px; font-weight:600; color:var(--moss-dark); }
.timer-display .state{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:0.06em; }
.video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:12px; overflow:hidden; margin-bottom:12px; border:1px solid var(--rule); }
.video-wrap iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }

/* Vision / reading text */
.vision-text{
  background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px 18px; margin-bottom:14px;
  font-family:'Fraunces', serif; font-size:16px; line-height:1.75; color:var(--ink);
}
.vision-text p{ margin:0 0 14px; }
.vision-text p:last-child{ margin-bottom:0; font-style:italic; color:var(--moss-dark); }

/* Forms */
.field-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.05em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px; display:block; }
.add-form{ background:var(--card); border:1px dashed var(--rule); border-radius:14px; padding:14px; margin-bottom:14px; }
.add-form input, .add-form textarea{
  width:100%; border:1px solid var(--rule); background:var(--white); border-radius:9px; padding:10px 12px;
  font-family:'IBM Plex Sans', sans-serif; font-size:14px; color:var(--ink); margin-bottom:8px; resize:vertical;
}
.add-form textarea{ min-height:64px; }
.add-form input:focus, .add-form textarea:focus{ outline:none; border-color:var(--moss); }
.btn{
  font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.03em; background:var(--moss); color:var(--white);
  border:none; border-radius:9px; padding:10px 16px; cursor:pointer; transition:background .15s ease;
}
.btn:active{ background:var(--moss-dark); }
.btn-row{ display:flex; gap:8px; }

/* Notes / goals list */
.note-card{ background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); }
.note-date{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); }
.note-text{ margin-top:6px; font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; }
.note-del{ margin-top:8px; border:none; background:none; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--danger); cursor:pointer; padding:0; }

.goal-row{ display:flex; align-items:flex-start; gap:10px; background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:12px; margin-bottom:8px; }
.goal-row .txt{ flex:1; font-size:14px; line-height:1.4; }
.goal-row.done .txt{ text-decoration:line-through; color:var(--ink-soft); }
.small-toggle{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--moss); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.small-toggle.done{ background:var(--moss); }
.small-toggle svg{ width:12px; height:12px; opacity:0; }
.small-toggle.done svg{ opacity:1; }
.small-toggle svg path{ stroke:var(--white); }
.goal-del{ border:none; background:none; color:var(--danger); font-family:'IBM Plex Mono', monospace; font-size:10.5px; cursor:pointer; }

.empty{ text-align:center; padding:36px 20px; color:var(--ink-soft); }
.empty .sig{ font-family:'Fraunces', serif; font-size:32px; color:var(--moss); margin-bottom:6px; }
.empty p{ font-size:13px; line-height:1.5; margin:4px 0 0; }

.loading{ padding:60px 20px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
  background:#2A4247; color:var(--white); font-family:'IBM Plex Mono', monospace; font-size:11.5px;
  padding:9px 16px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.exercise-card{ background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:18px; margin-bottom:14px; }
.exercise-card .day-tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:0.06em; }
.exercise-card h3{ font-family:'Fraunces', serif; font-size:19px; margin:6px 0 8px; }
.exercise-card .sets{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--moss-dark); margin-bottom:8px; }
.exercise-card .desc{ font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
.watch-link{
  display:inline-flex; align-items:center; gap:6px; margin-top:12px;
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--white);
  background:var(--moss); border-radius:20px; padding:8px 14px; text-decoration:none;
}
.watch-link svg{ width:12px; height:12px; }
.watch-link svg path{ fill:var(--white); }

/* Morning strip: goal reminder + quote */
.morning-strip{ margin-bottom:16px; }
.reminder-card{
  background:var(--gold-tint); border:1px solid var(--gold); border-radius:14px;
  padding:14px 16px; margin-bottom:10px;
}
.reminder-card .rc-label{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--gold); margin-bottom:4px;
}
.reminder-card .rc-text{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; color:var(--ink); line-height:1.4; }
.quote-card{
  background:#2A4247; border-radius:14px; padding:16px 18px; color:var(--white);
}
.quote-card .qc-mark{ font-family:'Fraunces', serif; font-size:26px; color:var(--gold); line-height:0.6; }
.quote-card .qc-text{ font-family:'Fraunces', serif; font-size:15.5px; font-style:italic; line-height:1.55; margin-top:4px; }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="masthead-top">
      <div class="eyebrow">Everyday</div>
      <div class="header-btns">
        <button class="sync-btn" id="syncBtn">Connect Drive</button>
        <button class="home-btn" id="homeBtnFixed"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
      </div>
    </div>
    <h1 id="headTitle">Home</h1>
    <div class="sub" id="headSub"></div>
  </header>

  <div class="tabstrip" id="tabstrip">
    <button class="tab-btn active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="meditate">Meditate</button>
    <button class="tab-btn" data-tab="affirm">Affirm</button>
    <button class="tab-btn" data-tab="vision">Vision Script</button>
    <button class="tab-btn" data-tab="board">Vision Board</button>
    <button class="tab-btn" data-tab="today">Journal</button>
    <button class="tab-btn" data-tab="exercise">Exercise</button>
    <button class="tab-btn" data-tab="gratitude">Gratitude</button>
    <button class="tab-btn" data-tab="reading">Reading</button>
    <button class="tab-btn" data-tab="goals">Goals</button>
  </div>

  <main id="content"><div class="loading">opening…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>
const AUDIO_DATA = {
  med10: "meditation-10.mp3",
  med15: "meditation-15.mp3",
  med20: "meditation-20.mp3",
  affirm: "affirmation.mp3"
};
const STORAGE_KEY = 'vision-app-data';
const CHECK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';

let state = { logs:{}, oneThingMind:'', todos:{}, selfNotes:[], goals:[] };
let activeTab = 'home';
let calMonthOffset = 0;
let saveTimer = null;

const MED_OPTIONS = [
  { label:'10 min', sec:600, key:'med10' },
  { label:'15 min', sec:900, key:'med15' },
  { label:'20 min', sec:1200, key:'med20' }
];
const AFFIRM_KEY = 'affirm';
const AFFIRMATIONS = [
  "I am a consistently profitable trader.",
  "I generate an income I can rely on.",
  "I am a consistent winner.",
  "I identify my edge.",
  "I am mindful, patient, and focused.",
  "I pre-define my risk, and I plan the trade.",
  "I have a series-of-trades perspective.",
  "I think in probabilities.",
  "I trade the best, and I leave the rest.",
  "I always follow my trading rules.",
  "I protect my account above all else.",
  "If there are no trading opportunities, I walk away.",
  "I earn and protect my capital.",
  "I follow my strategy.",
  "I am a magnet for wealth.",
  "I am worthy of abundance.",
  "I am successful.",
  "I have confidence in my abilities.",
  "I am powerful.",
  "I am calm.",
  "I am focused.",
  "I am a disciplined trader.",
  "I am loving kindness, compassion, and acceptance."
];

const MOTIVATION_QUOTES = [
  "Discipline today is the account balance of tomorrow. Trade the plan, not the moment.",
  "Every candle you don't chase is a decision you'll thank yourself for tonight.",
  "The calm you bring to the charts is the same calm Saanjh learns from watching you.",
  "You don't need every trade to work. You need your process to work, every time.",
  "Strong body, clear mind, steady hands — that's the whole edge, really.",
  "Abundance isn't luck. It's what shows up when patience meets preparation.",
  "The best trade some days is the one you walked away from.",
  "Small, consistent wins compound quieter than losses, but they compound longer.",
  "You are building two things at once this year — a portfolio and a daughter who watches how you build it.",
  "Rest is not the opposite of discipline. It's part of it.",
  "The market will still be there tomorrow. Protect the capital, protect the calm.",
  "Confidence isn't knowing you're right. It's trusting your rules even when you're not sure.",

  "The version of you that hits 8% this year is being built in mornings exactly like this one.",
  "Slow is smooth. Smooth is profitable.",

  "The account grows the same way the body does — quietly, with reps nobody claps for.",
  "Today's one thing, done well, is worth more than five things done anxiously."

const GRATITUDE_LIST = [
  "I am grateful that my family and friends are always happy, healthy, prosperous and positive in life.",
  "I am thankful for my healthy mind and body.",
  "I am happy and grateful for the life I love, and the love in my life.",
  "I am grateful for all the money I have right now and for all the money I am manifesting into my life."
];

const DAILY_VISION_STORIES = [
  "You walk into a 3.5 BHK home where every room opens onto its own balcony, morning light pouring in. The mandir room is quiet and lit. Downstairs, the society garden is already full of kids' laughter — Saanjh is one of them.",
  "The account statement refreshes: ₹1 Crore invested, working quietly in the background. This month's ₹1 Lakh has already landed, set aside just for you to spend freely, without a second thought.",
  "You catch your reflection walking past the mirror — 33-inch waist, strong shoulders, a beach body you built at 40 through daily discipline, not shortcuts. It feels earned.",
  "It's date night. Just you and Rohan, candles on the table, no phones, no rush — one evening a month, protected no matter how busy trading gets.",
  "Saanjh reads a full page in Gujarati out loud, proud of herself. You watch a natural leader forming in real time — kind, patient, endlessly curious.",
  "You close the trading terminal for the day: 80%+ win rate this month, criteria followed exactly, zero emotional trades. Calm in, calm out.",
  "March 2027, and the monthly trading income crosses ₹50,000 — third month in a row. The declaration you signed to yourself is no longer a goal. It's just Tuesday.",
  "The driver pulls up outside; you step in with your laptop bag, headed to teach a small group of eager traders the exact system that changed your life.",
  "A part of this month's trading profit quietly goes toward a child's school fees somewhere you'll never meet them. That's the whole point.",
  "The hall balcony is full of blooming plants, morning sun, and a two-seater swing gently moving. You sit there with your green tea before the day starts.",
  "Backtest Monday: 150 trades logged against the 30 SMA, new entries identified, notebook closed with total clarity on the week ahead.",
  "Your wardrobe has exactly what you need — smart, stylish, minimal. Getting dressed takes ninety seconds and you still walk out looking sharp.",
  "Family and friends gather in your large living hall, and you realize people trust your word completely. You are, without trying, the life of the room.",
  "You and Rohan land somewhere new for your one big trip of the year — no budgeting anxiety, just presence, and a photo that becomes next year's wallpaper.",
  "Saanjh stands at a whiteboard, explaining her idea to the whole class, completely unshaken. Confidence you didn't have to force into her — you modeled it.",
  "Robotic vacuum humming quietly, dishwasher running, a dedicated cook handling dinner — the house runs itself so your mind stays on the charts and on your family, not chores.",
  "You read one more biography of a trader who mastered patience before profit. Another data point for the mindset you're building, one page at a time.",
  "International boarding gate, whole family together, tickets self-funded, nothing borrowed. You built the freedom to just decide and go.",
  "Someone tells you that watching your journey inspired them to finally take their own goals seriously. That was always part of the plan — legacy, not just profit.",

"It's early. My eyes open on their own, easy and rested. I reach over and find a hand already there. A small squeeze back. Mornings feel light like this now.",
"The nightstand is clear. The bed gets made without thinking. The room looks back at me, calm — my exhale.",
"I slip into my workout clothes and move — a walk, a stretch, a real sweat. My body feels strong, alive, capable. I catch myself in the mirror afterward and I look fit, glowing, like someone who takes care of herself.",
"My wardrobe feels like me — simple, clean, a few good pieces, nothing cluttered. Getting dressed takes no thought, and I still walk out looking put-together.",
"In the kitchen, Saanjh is already narrating some discovery to herself. 'Mumma, did you know—' I crouch down and actually listen. That hunger in her to know things — it's just who she is now, and some part of me knows I helped build that.",
"Ronak hands me green tea and kisses my forehead — just because it's morning. One kiss, one hug, every day. Warm and constant.",
"I move through my day with quiet confidence. People know me as reliable, someone whose word means something — trusted and valued by everyone around me. It feels good, earned, real.",
"Later, I open my trading account with familiar focus. Up 8% again this year. Steady. Tracked. Real. ₹50,000 landed this month, same as most months, and I spend some of it freely, with a full and grateful heart.",
"I got here by showing up, day after day. Now it just works, quietly, in the background — the way I always wanted it to.",
"Some evening this month is date night with Ronak — the one we both protect and look forward to.",
"At night, Saanjh and I curl up together and read — her favourite ritual, and mine. Her eyes light up at every page. It's some of the sweetest time in my whole day.",
"At the end of the day, I walk back into that room. Bed made. Nightstand clear. Something settles in me — a deep, steady pride. Calm. Capable. Confident. Proud of who I've become.",
"\"I am calm, capable, strong, and confident. My account grows 8% a year, I move my body every day, and every night ends with a story and a hug with Saanjh.\""

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function dayOfYear(d){ const start=new Date(d.getFullYear(),0,0); const diff=d-start; return Math.floor(diff/86400000); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getLog(ds){ if(!state.logs[ds]) state.logs[ds] = { water:false, meditation:false, affirmation:false, exercise:false, gratitude:false, reading:false, visionScript:false, todoDone:false }; return state.logs[ds]; }

// ---------- Google Drive sync ----------
const GOOGLE_CLIENT_ID = '790506952741-mnbhsno9f55uvc1v3uas786pr90cbv8l.apps.googleusercontent.com';
const DRIVE_FILENAME = 'everyday-app-data.json';
let accessToken = null;
let tokenClient = null;
let driveFileId = localStorage.getItem('everyday-drive-file-id') || null;

function waitForGis(cb, tries){
  tries = tries || 0;
  if(window.google && google.accounts && google.accounts.oauth2){ cb(); }
  else if(tries < 240){ setTimeout(()=>waitForGis(cb, tries+1), 500); }
  else { showToast("Google sign-in couldn't load — check your connection"); }
}
function initGis(){
  if(GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR')===0) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: async (resp)=>{
      if(resp.error){ showToast('Google sign-in failed'); return; }
      accessToken = resp.access_token;
      localStorage.setItem('everyday-signed-in', '1');
      await syncFromDrive();
      updateSyncUI();
      render();
      showToast('Connected to Google Drive');
    }
  });
}
function connectDrive(){
  if(tokenClient){ tokenClient.requestAccessToken({ prompt: 'consent' }); return; }
  showToast('Loading Google sign-in — one moment');
  waitForGis(()=>{
    initGis();
    if(tokenClient) tokenClient.requestAccessToken({ prompt: 'consent' });
    else showToast("Couldn't load Google sign-in — try reloading the page");
  });
}
function disconnectDrive(){
  accessToken = null;
  localStorage.removeItem('everyday-signed-in');
  updateSyncUI();
  showToast('Disconnected from Google Drive');
}
async function driveFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + accessToken });
  return fetch(url, opts);
}
async function findOrCreateDriveFile(){
  if(driveFileId) return driveFileId;
  const q = encodeURIComponent("name='" + DRIVE_FILENAME + "' and trashed=false");
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name)');
  const data = await res.json();
  if(data.files && data.files.length){
    driveFileId = data.files[0].id;
  } else {
    const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ name: DRIVE_FILENAME, mimeType:'application/json' })
    });
    const created = await createRes.json();
    driveFileId = created.id;
  }
  localStorage.setItem('everyday-drive-file-id', driveFileId);
  return driveFileId;
}
async function syncFromDrive(){
  try{
    const id = await findOrCreateDriveFile();
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
    if(res.ok){
      const text = await res.text();
      if(text && text.trim()){
        const p = JSON.parse(text);
        state = { logs:p.logs||{}, oneThingMind:p.oneThingMind||'', todos:p.todos||{}, selfNotes:p.selfNotes||[], goals:p.goals||[] };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    }
  }catch(e){ /* keep local copy if Drive is unreachable */ }
}
async function syncToDrive(){
  if(!accessToken) return;
  try{
    const id = await findOrCreateDriveFile();
    await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(state)
    });
    document.querySelectorAll('.sync-status').forEach(el=> el.textContent = 'synced just now');
  }catch(e){ showToast("couldn't sync to Drive — saved on this device"); }
}
function updateSyncUI(){
  document.querySelectorAll('.sync-btn').forEach(el=>{
    el.textContent = accessToken ? 'Drive connected' : 'Connect Drive';
    el.classList.toggle('connected', !!accessToken);
  });
}

async function loadState(){
  try{
    const cached = localStorage.getItem(STORAGE_KEY);
    if(cached){
      const p = JSON.parse(cached);
      state = { logs:p.logs||{}, oneThingMind:p.oneThingMind||'', todos:p.todos||{}, selfNotes:p.selfNotes||[], goals:p.goals||[] };
    }
  }catch(e){ /* fresh start */ }
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(accessToken) await syncToDrive();
    }catch(e){ showToast("couldn't save — try again"); }
  }, 150);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function toggleField(field, ds){

function weekDates(offset){
  const now = new Date();
  const dow = now.getDay();
  const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + offset*7);
  const dates = [];
  for(let i=0;i<7;i++){
    const d = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate()+i);
    dates.push(d);
  }
  return dates;
}
function dsOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekLabel(dates){
  const a = dates[0], b = dates[6];
  const fmt = (d)=> d.toLocaleDateString('en-IN',{day:'numeric', month:'short'});
  return `${fmt(a)} – ${fmt(b)}`;
}
function renderWeek(){
  const dates = weekDates(calMonthOffset);

  let html = `<div class="week-head"><div class="label">${weekLabel(dates)}</div><div class="week-nav">

  dates.forEach((d,i)=>{

function exportBackup(){
  try{
    if(typeof XLSX==='undefined'){ showToast("Excel export isn't available right now"); return; }

        Date: ds,

        "Task Done": log.todoDone ? 'Yes' : 'No'
      };
    });
    const dailySheet = XLSX.utils.json_to_sheet(dailyRows.length ? dailyRows : [{Date:'', Water:'', Meditation:'', Affirmation:'', Exercise:'', Gratitude:'', Reading:'', "Today's Task":'', "Task Done":''}]);
    XLSX.utils.book_append_sheet(wb, dailySheet, 'Daily Log');

    // Sheet 2: Self notes
    const noteRows = state.selfNotes.slice().reverse().map(n=>{
      const d = new Date(n.ts);
      return { Date: d.toLocaleDateString('en-IN'), Time: d.toLocaleTimeString('en-IN'), Note: n.text };
    });
    const notesSheet = XLSX.utils.json_to_sheet(noteRows.length ? noteRows : [{Date:'', Time:'', Note:''}]);
    XLSX.utils.book_append_sheet(wb, notesSheet, 'Self Notes');

    // Sheet 3: Goals
    const goalRows = state.goals.map(g=>{
      const d = new Date(g.ts);
      return { Goal: g.text, Done: g.done ? 'Yes' : 'No', "Added On": d.toLocaleDateString('en-IN') };
    });
    const goalsSheet = XLSX.utils.json_to_sheet(goalRows.length ? goalRows : [{Goal:'', Done:'', "Added On":''}]);
    XLSX.utils.book_append_sheet(wb, goalsSheet, 'Goals');

    // Sheet 4: One thing on my mind (single free-text note)
    const mindSheet = XLSX.utils.json_to_sheet([{ "On my mind": state.oneThingMind || '' }]);
    XLSX.utils.book_append_sheet(wb, mindSheet, 'On My Mind');

    XLSX.writeFile(wb, 'everyday-backup-' + todayStr() + '.xlsx');
    showToast('Excel file downloaded');
  }catch(e){
    showToast("couldn't export — try again");
  }
}

  const sel = window.__medSel!=null ? MED_OPTIONS[window.__medSel] : null;
  if(sel){

    html += `<div class="timer-display"><div class="time" id="timerTime">${fmtMMSS(sel.sec)}</div><div class="state" id="timerState">plays fully offline — time remaining</div></div>`;
    html += `<div class="btn-row"><button class="btn ghost" id="medDoneBtn">Mark meditation done</button></div>`;

function fmtMMSS(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function attachMedAudioHandlers(){
  const audio = document.getElementById('medAudio');
  if(!audio) return;
  audio.addEventListener('timeupdate', ()=>{
    if(isNaN(audio.duration)) return;
    const remaining = Math.max(0, Math.round(audio.duration - audio.currentTime));
    const timeEl = document.getElementById('timerTime');
    if(timeEl) timeEl.textContent = fmtMMSS(remaining);
  });
  audio.addEventListener('ended', ()=>{
    const log = getLog(todayStr());
    log.meditation = true;
    saveState();
    showToast('meditation marked done');
    render();
  });
}

  </div>`;
  if(state.selfNotes.length===0){
    html += `<div class="empty"><div class="sig">✎</div><p>Notes you save will show up here,<br>newest first.</p></div>`;
    return html;
  }
  html += `<div class="section-title">Notes<span class="count">${state.selfNotes.length}</span></div>`;
  state.selfNotes.forEach(n=>{
    const d = new Date(n.ts);
    const dl = d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    html += `<div class="note-card"><div class="note-date">${dl}</div>
      <div class="note-text">${escapeHtml(n.text)}</div>
      <button class="note-del" data-del-note="${n.id}">delete</button></div>`;
  });
  return html;
}

// ---------- GOALS ----------
function renderGoals(){
  let html = `<div class="section-title">Add a goal</div>
  <div class="add-form">
    <input type="text" id="goalText" placeholder="e.g. Grow trading account 8% this year" maxlength="120">
    <div class="btn-row"><button class="btn" id="addGoalBtn">Add goal</button></div>
  </div>`;
  if(state.goals.length===0){
    html += `<div class="empty"><div class="sig">✦</div><p>Your goal list will show up here.</p></div>`;
    return html;
  }
  html += `<div class="section-title">Goals<span class="count">${state.goals.length}</span></div>`;
  state.goals.forEach(g=>{
    html += `<div class="goal-row ${g.done?'done':''}">
      <button class="small-toggle ${g.done?'done':''}" data-goal-toggle="${g.id}">${CHECK}</button>
      <div class="txt">${escapeHtml(g.text)}</div>
      <button class="goal-del" data-goal-del="${g.id}">✕</button>
    </div>`;
  });
  return html;
}

// ---------- MAIN RENDER ----------
const TAB_TITLES = {
  home:['Home','Hello Pankti, your day at a glance'],
  meditate:['Meditate','ten, fifteen, or twenty minutes'],
  affirm:['Affirmation','say it, feel it'],
  vision:['Vision Script','the life you\'re building'],
  board:['Vision Board','a picture of where you\'re headed'],
  today:['Journal','a clear space and a clear task'],
  exercise:['Exercise','five minutes, right at home'],
  gratitude:['Gratitude','from your own journal'],
  reading:['Reading','a few pages, every day'],
  goals:['Goals','what you\'re working toward']
};

function render(){
  const [title, sub] = TAB_TITLES[activeTab];
  document.getElementById('headTitle').textContent = title;
  document.getElementById('headSub').textContent = sub;
  const content = document.getElementById('content');
  if(activeTab==='home') content.innerHTML = renderHome();
  else if(activeTab==='meditate') content.innerHTML = renderMeditate();
  else if(activeTab==='affirm') content.innerHTML = renderAffirm();
  else if(activeTab==='vision') content.innerHTML = renderVision();
  else if(activeTab==='board') content.innerHTML = renderVisionBoard();
  else if(activeTab==='today') content.innerHTML = renderToday();
  else if(activeTab==='exercise') content.innerHTML = renderExercise();
  else if(activeTab==='gratitude') content.innerHTML = renderGratitude();
  else if(activeTab==='reading') content.innerHTML = renderReading();
  else if(activeTab==='goals') content.innerHTML = renderGoals();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleField(btn.dataset.toggle));
  });
  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.open));
  });
  document.querySelectorAll('[data-week]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ calMonthOffset += parseInt(btn.dataset.week,10); render(); });
  });
  document.querySelectorAll('[data-day]').forEach(cell=>{
    cell.addEventListener('click', ()=>{ selectedDate = cell.dataset.day; render(); });
  });
  document.querySelectorAll('[data-day-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleField(el.dataset.dayToggle, selectedDate); });
  });
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  document.querySelectorAll('[data-med]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      window.__medSel = parseInt(btn.dataset.med,10);
      render();
    });
  });
  attachMedAudioHandlers();
  const medDoneBtn = document.getElementById('medDoneBtn');
  if(medDoneBtn){
    medDoneBtn.addEventListener('click', ()=>{
      const log = getLog(todayStr());
      log.meditation = true;
      saveState();
      showToast('meditation marked done');
      render();
    });
  }
  const saveMindBtn = document.getElementById('saveMindBtn');
  if(saveMindBtn){
    saveMindBtn.addEventListener('click', ()=>{
      state.oneThingMind = document.getElementById('mindText').value;
      saveState();
      showToast('saved');
    });
  }
  const saveTodoBtn = document.getElementById('saveTodoBtn');
  if(saveTodoBtn){
    saveTodoBtn.addEventListener('click', ()=>{
      state.todos[todayStr()] = document.getElementById('todoText').value.trim();
      saveState();
      showToast('saved');
      render();
    });
  }
  const addNoteBtn = document.getElementById('addNoteBtn');
  if(addNoteBtn){
    addNoteBtn.addEventListener('click', ()=>{
      const t = document.getElementById('noteText');
      if(t.value.trim()){
        state.selfNotes.unshift({ id:uid(), text:t.value.trim(), ts:Date.now() });
        saveState(); t.value=''; render();
      }
    });
  }
  const oneThingAddNoteBtn = document.getElementById('oneThingAddNoteBtn');
  if(oneThingAddNoteBtn){
    oneThingAddNoteBtn.addEventListener('click', ()=>{
      const t = document.getElementById('oneThingNoteText');
      if(t.value.trim()){
        state.selfNotes.unshift({ id:uid(), text:t.value.trim(), ts:Date.now() });
        saveState(); t.value='';
        showToast('note saved');
      }
    });
  }
  document.querySelectorAll('[data-del-note]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Delete this note?')){
        state.selfNotes = state.selfNotes.filter(n=>n.id!==btn.dataset.delNote);
        saveState(); render();
      }
    });
  });
  const addGoalBtn = document.getElementById('addGoalBtn');
  if(addGoalBtn){
    addGoalBtn.addEventListener('click', ()=>{
      const t = document.getElementById('goalText');
      if(t.value.trim()){
        state.goals.push({ id:uid(), text:t.value.trim(), done:false, ts:Date.now() });
        saveState(); t.value=''; render();
      }
    });
  }
  document.querySelectorAll('[data-goal-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = state.goals.find(g=>g.id===btn.dataset.goalToggle);
      if(g){ g.done = !g.done; saveState(); render(); }
    });
  });
  document.querySelectorAll('[data-goal-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.goals = state.goals.filter(g=>g.id!==btn.dataset.goalDel);
      saveState(); render();
    });
  });
}

function switchTab(tab){
  activeTab = tab;
  calMonthOffset = 0;
  if(tab==='home') selectedDate = todayStr();
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});
document.getElementById('homeBtnFixed').addEventListener('click', ()=> switchTab('home'));
document.getElementById('syncBtn').addEventListener('click', ()=>{
  if(accessToken) disconnectDrive(); else connectDrive();
});

(async function init(){
  await loadState();
  render();
  waitForGis(()=>{
    initGis();
    updateSyncUI();
    if(localStorage.getItem('everyday-signed-in')==='1' && tokenClient){
      tokenClient.requestAccessToken({ prompt: '' });
    }
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
